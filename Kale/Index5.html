<!DOCTYPE html>
<html>
    <head>
        <Title>Deluxe Shop</Title>
        <style>
            .main {
                display: grid;
                grid-template-columns: auto auto auto auto;
                grid-template-rows: auto auto 1fr ;
                grid-template-areas: "header header header"
                                     "container container container";
                grid-gap: 10px;
                
                
            }

            .container {
                display: grid;
                grid-template-columns: auto auto auto auto;
                grid-template-rows: 1fr 1fr;
                grid-area: container;
                background: goldenrod;
                grid-gap: 5px;
            }

            .header {
                grid-area: header;

            }

            .body {
                background: gray;
            }

            .button1 {
                padding: 10px;
                font-size: 20px;
            }

            .button1:hover {
                background-color: lightgreen;
            }
        </style>
    </head>
    
    <body class="body">
       
        <main class="main">
           
            <h1 class="header">RikaKatter - Shop</h1>
           
            <div class="container">
                <p>
                    Gimsel (Standard)
                    <br>
                    Pris - 100 504kr
                </p>
                <img src="Richkattstand.jpg" height="100" width="100">
                
                <p>
                    Gimsel (Business)
                    <br>
                    Pris - 500 688kr
                </p>
                <img src="Rikakatterbusiness.jpg" height="100" width="100">
                
                <p>
                    Gimsel (Mafia)
                    <br>
                    Pris - 879 648kr
                </p>
                <img src="Rikakattermafia.jpg" height="100" width="100">
                
                <p>
                    Gimsel (Luxury)
                    <br>
                    Pris - 1 009 588kr
                </p>
                <img src="Rikakatterluxury.jpg" height="100" width="100">
                
                <p>
                    Gimsel (Gold)
                    <br>
                    Pris - 50 000 000kr
                </p>
                <img src="Rikakattergolden.jpg" height="100" width="100">
            </div>
        </main>

        <button class="button1" onclick="window.location.href='Index.html'">Återvänd</button>
    </body>
</html>
